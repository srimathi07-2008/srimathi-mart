<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Srimathi Mart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffdf8;
            color: #3d321f;
        }

        .admin-login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at top right, #fff5d6, transparent 35%),
                #fffdf8;
        }

        .admin-login-card {
            width: 100%;
            max-width: 470px;
            padding: 38px;
            background: #ffffff;
            border: 1px solid #ead9a7;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(150, 110, 20, 0.15);
        }

        .back-link {
            color: #a77a08;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            color: #d4af37;
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
        }

        .admin-logo {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #c49a27, #f1d77b);
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .admin-brand strong {
            display: block;
            color: #a77a08;
            font-size: 22px;
        }

        .admin-brand span {
            display: block;
            margin-top: 3px;
            color: #806f50;
            font-size: 13px;
        }

        .admin-security {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            padding: 13px;
            border-radius: 10px;
            background: #fffaf0;
            border: 1px solid #ead9a7;
        }

        .admin-security > span {
            font-size: 24px;
        }

        .admin-security strong {
            color: #a77a08;
            font-size: 14px;
        }

        .admin-security p {
            margin: 3px 0 0;
            color: #806f50;
            font-size: 12px;
        }

        .admin-heading {
            margin: 28px 0 25px;
        }

        .admin-heading p {
            margin: 0;
            color: #b8860b;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .admin-heading h1 {
            margin: 9px 0;
            color: #3b301c;
            font-size: 34px;
        }

        .admin-heading span {
            color: #75694e;
            line-height: 1.6;
            font-size: 14px;
        }

        form label {
            display: block;
            margin: 16px 0 7px;
            color: #4c4028;
            font-size: 14px;
            font-weight: bold;
        }

        form input[type="email"],
        form input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #ddcc9b;
            border-radius: 9px;
            background: #fffdf8;
            color: #3d321f;
            outline: none;
        }

        form input:focus {
            border-color: #c49a27;
            box-shadow: 0 0 0 3px rgba(196, 154, 39, 0.12);
        }

        .admin-password {
            display: flex;
            gap: 8px;
        }

        .admin-password input {
            flex: 1;
        }

        #adminTogglePassword {
            padding: 0 14px;
            border: 1px solid #d4af37;
            border-radius: 9px;
            background: #fff8e5;
            color: #9a7410;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            font-size: 13px;
        }

        .admin-options label {
            margin: 0;
            font-weight: normal;
            color: #75694e;
        }

        .admin-options a {
            color: #a77a08;
            text-decoration: none;
            font-weight: bold;
        }

        .admin-login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.25);
        }

        .admin-login-button:hover {
            background: #a77a08;
            transform: translateY(-1px);
        }

        .admin-note {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-top: 22px;
            padding: 13px;
            border-radius: 10px;
            background: #fffaf0;
            border: 1px solid #eee0b8;
        }

        .admin-note span {
            color: #b8860b;
            font-size: 18px;
        }

        .admin-note p {
            margin: 0;
            color: #806f50;
            font-size: 12px;
            line-height: 1.5;
        }

        .admin-footer {
            margin: 22px 0 0;
            text-align: center;
            color: #a77a08;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 520px) {
            .admin-login-card {
                padding: 25px;
            }

            .admin-heading h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-login-page">

        <section class="admin-login-card">

            <a href="index.html" class="back-link">
                &#8592; Back to role selection
            </a>

            <div class="admin-brand">

                <div class="admin-logo">
                    S
                </div>

                <div>
                    <strong>Srimathi Mart</strong>
                    <span>Administration</span>
                </div>

            </div>

            <div class="admin-security">

                <span>&#10024;</span>

                <div>
                    <strong>Secure access</strong>
                    <p>Authorized administrators only</p>
                </div>

            </div>

            <div class="admin-heading">

                <p>ADMINISTRATOR</p>

                <h1>Welcome back.</h1>

                <span>
                    Sign in to manage the Srimathi Mart marketplace.
                </span>

            </div>

            <form id="adminLoginForm">

                <label for="adminEmail">
                    Admin email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                >

                <label for="adminPassword">
                    Password
                </label>

                <div class="admin-password">

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                    >

                    <button
                        type="button"
                        id="adminTogglePassword"
                    >
                        Show
                    </button>

                </div>

                <div class="admin-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" onclick="adminForgotPassword(event)">
                        Forgot password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Access Dashboard &#8594;
                </button>

            </form>

            <div class="admin-note">

                <span>ⓘ</span>

                <p>
                </p>

            </div>

            <p class="admin-footer">
                Srimathi Mart &#10022; Admin Portal
            </p>

        </section>

    </main>

    <script src="api.js"></script>
    <script src="script.js"></script>

</body>
</html>
