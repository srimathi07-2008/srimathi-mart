<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Buyer Account | Srimathi Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NEW page, added by the Java conversion. It reuses the existing
         .login-page / .login-card classes from login.html so it inherits the
         same look. No CSS was added or changed for it. -->

    <main class="login-page">

        <section class="login-card">

            <a href="login.html" class="back-link">
                &#8592; Back to sign in
            </a>

            <div class="login-logo">
                <span class="logo-icon">S</span>
                <span>Srimathi Mart</span>
            </div>

            <p class="login-label">BUYER ACCOUNT</p>

            <h1>Create your account</h1>

            <p class="login-description">
                Join Srimathi Mart to start shopping.
            </p>


            <form id="buyerRegisterForm">

                <label for="fullName">Full name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >


                <label for="registerEmail">Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                >


                <label for="registerPassword">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 8 characters"
                    >

                    <button
                        type="button"
                        id="toggleRegisterPassword"
                        class="show-password"
                    >
                        Show
                    </button>

                </div>


                <label for="confirmPassword">Confirm password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                >


                <button type="submit" class="login-button">
                    Create account
                </button>

            </form>


            <p class="signup-text">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <p class="demo-note">
                Are you a seller?
                <a href="seller-register.html">Create a seller account</a>
            </p>

        </section>

    </main>


    <script src="api.js"></script>
    <script src="script.js"></script>

    <script>
    (function () {

        const form = document.getElementById("buyerRegisterForm");
        const password = document.getElementById("registerPassword");
        const toggle = document.getElementById("toggleRegisterPassword");

        if (toggle && password) {

            toggle.addEventListener("click", function () {

                if (password.type === "password") {
                    password.type = "text";
                    toggle.textContent = "Hide";
                } else {
                    password.type = "password";
                    toggle.textContent = "Show";
                }

            });

        }

        if (!form) {
            return;
        }

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("registerEmail").value.trim();

            const raw = password.value;

            const confirm =
                document.getElementById("confirmPassword").value;

            if (fullName === "" || email === "" || raw === "") {
                alert("Please fill in every field.");
                return;
            }

            if (raw !== confirm) {
                alert("The two passwords do not match.");
                return;
            }

            smPost("/api/register", {
                fullName: fullName,
                email: email,
                password: raw,
                confirmPassword: confirm,
                role: "BUYER"
            }).then(function (data) {

                window.location.href = data.redirect;

            }).catch(function (error) {

                alert(error.message);

            });

        });

    })();
    </script>

</body>
</html>
