<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Srimathi Mart | Seller</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="shop-navbar">

        <div class="shop-logo">
            <span>S</span>
            <strong>Srimathi Mart</strong>
        </div>

        <nav class="desktop-nav">
            <a href="home.html">Home</a>
            <a href="seller.html">Seller Dashboard</a>
            <a href="index.html" onclick="smLogout(event)">Logout</a>
        </nav>

    </header>

    <main>
        <h1>Seller Dashboard </h1>

        <p>Welcome to your seller space.</p>
<h2>Add New Product</h2>

<input type="text" id="productName" placeholder="Product Name">

<input type="number" id="productPrice" placeholder="Price">

<!-- ADDED by the Java conversion: F2 requires description, stock, category
     and image URL. Same bare input style the page already used. -->
<input type="text" id="productDescription" placeholder="Description">

<input type="number" id="productStock" placeholder="Stock quantity">

<input type="text" id="productCategory" placeholder="Category (Fashion, Electronics, Home, Beauty, Accessories, Sports)">

<input type="text" id="productImage" placeholder="Image URL or emoji, e.g. 🎧">

<button onclick="addSellerProduct()">Add Product</button>
<h2>My Products</h2>

<div id="sellerProductList"></div>
    </main>
<script>
// CONVERTED: this page used localStorage. It now talks to
// SellerProductServlet, so products live in the products table and are
// visible to buyers on home.html. Markup and page text are unchanged.

function addSellerProduct() {
    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value.trim();

    if (name === "" || price === "") {
        alert("Please enter product name and price.");
        return;
    }

    smPost("/api/seller/products", {
        action: "create",
        name: name,
        price: price,
        description: document.getElementById("productDescription").value.trim(),
        stockQuantity: document.getElementById("productStock").value.trim(),
        category: document.getElementById("productCategory").value.trim(),
        imageUrl: document.getElementById("productImage").value.trim()
    }).then(function () {

        displaySellerProducts();

        alert("Product added successfully! \u{1F6D2}");

        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productDescription").value = "";
        document.getElementById("productStock").value = "";
        document.getElementById("productCategory").value = "";
        document.getElementById("productImage").value = "";

    }).catch(function (error) {

        alert(error.message);

    });
}
function displaySellerProducts() {
    const productList =
        document.getElementById("sellerProductList");

    if (!productList) {
        return;
    }

    smGet("/api/seller/products").then(function (data) {

        productList.innerHTML = "";

        (data.products || []).forEach(function(product) {
            const item = document.createElement("div");

            item.innerHTML = `
            <h3>${smEscape(product.name)}</h3>
            <p>${smFormatPrice(product.price)}</p>
            <p>${smEscape(product.category)} &middot; ${product.stockQuantity} in stock</p>
            <button
            onclick="deleteSellerProduct(${product.id})">
            Delete
            </button>
            <button onclick="editSellerProduct(${product.id})">
                Edit
                </button>
        `;

            productList.appendChild(item);
        });

    }).catch(function (error) {

        productList.innerHTML = "<p>" + smEscape(error.message) + "</p>";

    });
}
function deleteSellerProduct(productId) {

    if (!confirm("Delete this product?")) {
        return;
    }

    smPost("/api/seller/products", {
        action: "delete",
        id: productId
    }).then(function () {

        displaySellerProducts();

    }).catch(function (error) {

        alert(error.message);

    });
}
function editSellerProduct(productId) {

    smGet("/api/seller/products").then(function (data) {

        const product = (data.products || []).find(
            item => String(item.id) === String(productId)
        );

        if (!product) {
            alert("That product no longer exists.");
            return;
        }

        const newName = prompt("Enter new product name:", product.name);
        const newPrice = prompt("Enter new price:", product.price);

        if (newName === null || newPrice === null) {
            return;
        }

        if (newName.trim() === "" || newPrice.trim() === "") {
            alert("Please enter valid details.");
            return;
        }

        const newDescription =
            prompt("Enter new description:", product.description);
        const newStock =
            prompt("Enter new stock quantity:", product.stockQuantity);
        const newCategory =
            prompt("Enter new category:", product.category);
        const newImage = prompt(
    "Enter image path (example: /srimathi-mart/images/money-plant.jpg):",
    product.imageUrl
);

        smPost("/api/seller/products", {
            action: "update",
            id: productId,
            name: newName.trim(),
            price: newPrice.trim(),
            description: newDescription === null ? product.description : newDescription,
            stockQuantity: newStock === null ? product.stockQuantity : newStock,
            category: newCategory === null ? product.category : newCategory,
            imageUrl: newImage === null ? product.imageUrl : newImage
        }).then(function () {

            displaySellerProducts();

        }).catch(function (error) {

            alert(error.message);

        });

    }).catch(function (error) {

        alert(error.message);

    });
}
displaySellerProducts();
</script>
    <!-- ADDED by the Java conversion: api.js holds every call to the
         servlets and must load before script.js, which uses it. -->
    <script src="api.js"></script>
    <script src="script.js"></script>

</body>
</html>
