<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Seller Account | Srimathi Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NEW page, added by the Java conversion. It reuses the existing
         .seller-login-page / .seller-login-card classes from
         seller-login.html, so it inherits the Seller Centre look with no
         CSS changes. -->

    <main class="seller-login-page">

        <section class="seller-login-card">

            <a href="seller-login.html" class="back-link">
                ← Back to seller sign in
            </a>

            <div class="seller-brand">
                <div class="seller-logo">S</div>

                <div>
                    <strong>Srimathi Mart</strong>
                    <span>Seller Centre</span>
                </div>
            </div>

            <div class="seller-heading">

                <p>SELLER ACCOUNT</p>

                <h1>Open your store.</h1>

                <span>
                    Create a seller account to list
                    and manage your products.
                </span>

            </div>


            <form id="sellerRegisterForm">

                <label for="sellerName">
                    Full name
                </label>

                <input
                    type="text"
                    id="sellerName"
                    placeholder="Enter your full name"
                >


                <label for="sellerRegisterEmail">
                    Seller email
                </label>

                <input
                    type="email"
                    id="sellerRegisterEmail"
                    placeholder="Enter your seller email"
                >


                <label for="sellerRegisterPassword">
                    Password
                </label>

                <div class="seller-password">

                    <input
                        type="password"
                        id="sellerRegisterPassword"
                        placeholder="At least 8 characters"
                    >

                    <button
                        type="button"
                        id="sellerToggleRegisterPassword"
                    >
                        Show
                    </button>

                </div>


                <label for="sellerConfirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="sellerConfirmPassword"
                    placeholder="Re-enter your password"
                >


                <button
                    type="submit"
                    class="seller-login-button"
                >
                    Create seller account →
                </button>

            </form>


            <div class="seller-info">

                <span>✦</span>

                <p>
                    Manage your marketplace store
                    from one simple dashboard.
                </p>

            </div>


            <p class="seller-demo">
                Already selling?
                <a href="seller-login.html">Sign in instead</a>
            </p>

        </section>

    </main>


    <script src="api.js"></script>
    <script src="script.js"></script>

    <script>
    (function () {

        const form = document.getElementById("sellerRegisterForm");
        const password = document.getElementById("sellerRegisterPassword");
        const toggle = document.getElementById("sellerToggleRegisterPassword");

        if (toggle && password) {

            toggle.addEventListener("click", function () {

                if (password.type === "password") {
                    password.type = "text";
                    toggle.textContent = "Hide";
                } else {
                    password.type = "password";
                    toggle.textContent = "Show";
                }

            });

        }

        if (!form) {
            return;
        }

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const fullName =
                document.getElementById("sellerName").value.trim();

            const email =
                document.getElementById("sellerRegisterEmail").value.trim();

            const raw = password.value;

            const confirm =
                document.getElementById("sellerConfirmPassword").value;

            if (fullName === "" || email === "" || raw === "") {
                alert("Please fill in every field.");
                return;
            }

            if (raw !== confirm) {
                alert("The two passwords do not match.");
                return;
            }

            smPost("/api/register", {
                fullName: fullName,
                email: email,
                password: raw,
                confirmPassword: confirm,
                role: "SELLER"
            }).then(function (data) {

                window.location.href = data.redirect;

            }).catch(function (error) {

                alert(error.message);

            });

        });

    })();
    </script>

</body>
</html>
